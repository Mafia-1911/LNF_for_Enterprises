packages:
  - apps/*
  - packages/*

# Only these dependencies may run install scripts (pnpm blocks the rest).
allowBuilds:
  esbuild: true
  lefthook: true

# Supply-chain guards (also checked by semgrep): refuse releases younger than a day and never
# install dependencies from git/tarball URLs deep in the tree.
# OPEN DECISION for the maintainer (docs/todo.md#supply-chain): semgrep also recommends
#   minimumReleaseAge: 10080   (7 days; today's pinned "current stable" versions are younger)
#   trustPolicy: no-downgrade   (rejects undici-types@6.21.0, required by @types/node@22)
# Both need a policy choice (wait, add reviewed exceptions, or accept the finding); not decided here.
minimumReleaseAge: 1440
blockExoticSubdeps: true

# pnpm refuses releases younger than its minimum age. These were the current
# stable versions on 2026-11-09 (vite shipped security patches that day), so
# they are allowed explicitly. Remove an entry once it is older than a day.
minimumReleaseAgeExclude:
  - '@hookform/resolvers@7.0.5'
  - '@rolldown/binding-android-arm-eabi@1.2.18'
  - '@rolldown/binding-android-arm64@1.2.18'
  - '@rolldown/binding-darwin-arm64@1.2.18'
  - '@rolldown/binding-darwin-x64@1.2.18'
  - '@rolldown/binding-freebsd-x64@1.2.18'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.18'
  - '@rolldown/binding-linux-arm64-gnu@1.2.18'
  - '@rolldown/binding-linux-arm64-musl@1.2.18'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.18'
  - '@rolldown/binding-linux-s390x-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-musl@1.2.18'
  - '@rolldown/binding-openharmony-arm64@1.2.18'
  - '@rolldown/binding-win32-arm64-msvc@1.2.18'
  - '@rolldown/binding-win32-x64-msvc@1.2.18'
  - '@vitejs/plugin-react@6.3.0'
  - rolldown@1.2.18
  - vite@8.3.7

# Exact versions only: `pnpm add` writes "1.2.3", never "^1.2.3".
saveExact: true
