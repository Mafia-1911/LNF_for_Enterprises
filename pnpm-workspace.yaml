packages:
  - apps/*
  - packages/*

# Only these dependencies may run install scripts (pnpm blocks the rest).
allowBuilds:
  esbuild: true
  lefthook: true

# Supply-chain guards (also checked by semgrep): refuse releases younger than 7 days, refuse a
# version published with weaker trust evidence than earlier ones (a sign of a package takeover),
# and never install dependencies from git/tarball URLs deep in the tree. Decided 2026-11-12 so CI
# (and the deploy that waits for it) can pass: strict settings plus reviewed exceptions below.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Reviewed: undici-types is TypeScript declarations only (no code runs), pulled in by @types/node@22.
trustPolicyExclude:
  - 'undici-types@6.21.0'
blockExoticSubdeps: true

# Exact versions already in the lockfile that were younger than 7 days on 2026-11-12 (the current
# stable versions pinned during phases 3 to 5; vite shipped security patches on 2026-11-09). Only
# these exact versions skip the wait. An entry can go once it is 7 days old (by 2026-11-19).
minimumReleaseAgeExclude:
  - 'jsdom@31.0.0'
  - 'lucide-react@1.70.0'
  - 'nodemailer@10.4.0'
