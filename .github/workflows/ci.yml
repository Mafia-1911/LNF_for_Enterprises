# CI runs the same gates as `pnpm verify` on every push and pull request.
# Actions are pinned to commit SHAs (tag in the comment). Everything runs on the free GitHub-hosted
# runner with the local stand-ins from infra/docker-compose.dev.yml; no secrets are needed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install --global pnpm@12.18.0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Start local services
        run: |
          cp .env.example .env
          bash scripts/infra-up.sh

      - name: pnpm verify
        run: pnpm verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            reports/mutation/
          retention-days: 7
